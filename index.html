      }

      const DB_NAME = "PitchingProgramV2";
      const DB_VERSION = 1;
      const STORE_NAME = "programData";

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
        });
      }

      async function loadData() {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const req = store.get("data");

          return new Promise((resolve) => {
            req.onsuccess = () => {
              const result = req.result;
              db.close();
              if (!result) {
                resolve(normalizeProgramData(DEFAULT_DATA));
                return;
              }
              resolve(normalizeProgramData(result));
            };
            req.onerror = () => {
              db.close();
              resolve(normalizeProgramData(DEFAULT_DATA));
            };
          });
        } catch (err) {
          console.error("Failed to load IndexedDB data:", err);
          return normalizeProgramData(DEFAULT_DATA);
        }
      }

      async function saveData(data) {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(
            {
              ...data,
              lastUpdated: new Date().toISOString(),
            },
            "data"
          );
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              db.close();
              resolve();
            };
            tx.onerror = () => {
              db.close();
              reject(tx.error);
            };
          });
        } catch (err) {
          console.error("Failed to save IndexedDB data:", err);
        }
      }

      function downloadTextFile(filename, objectData) {
        const text = JSON.stringify(objectData, null, 2);
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      function readJsonFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              resolve(parsed);
            } catch (err) {
              reject(new Error("Invalid JSON/TXT file."));
            }
          };
          reader.onerror = () => reject(reader.error);
          reader.readAsText(file);
        });
      }

      function hiddenFileInput(onFile) {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".txt,.json,text/plain,application/json";
        input.onchange = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            await onFile(file);
          }
        };
        input.click();
      }

      function todayIso() {
        return new Date().toISOString().split("T")[0];
      }

      function addDaysToIso(dateString, offset) {
        const date = new Date(`${dateString}T12:00:00`);
        date.setDate(date.getDate() + offset);
        return date.toISOString().split("T")[0];
      }

      function estimateWorkoutDurationFromExercises(exercises) {
        return Math.round(
          (exercises.reduce((sum, ex) => {
            const repsNum = parseInt(ex.reps) || 5;
            return sum + repsNum + (Number(ex.rest) || 0);
          }, 0) || 0) / 60
        );
      }

      function normalizeExercise(exercise = {}) {
        return {
          ...exercise,
          id: exercise.id || uuid(),
          name: exercise.name || "Untitled Exercise",
          description: exercise.description || "",
          sets: Number(exercise.sets) || 1,
          reps: exercise.reps || "10",
          rest: Number(exercise.rest) || 0,
          videoName: exercise.videoName || "",
          videoType: exercise.videoType || "",
          videoData: exercise.videoData || "",
          videoName2: exercise.videoName2 || "",
          videoType2: exercise.videoType2 || "",
          videoData2: exercise.videoData2 || "",
        };
      }

      function hashString(value) {
        return String(value || "")
          .split("")
          .reduce((hash, char) => ((hash << 5) - hash + char.charCodeAt(0)) | 0, 0);
      }

      function workoutColorClasses(workoutId) {
        const palette = [
          "border-sky-300 bg-sky-50 text-sky-950",
          "border-emerald-300 bg-emerald-50 text-emerald-950",
          "border-amber-300 bg-amber-50 text-amber-950",
          "border-violet-300 bg-violet-50 text-violet-950",
          "border-rose-300 bg-rose-50 text-rose-950",
          "border-cyan-300 bg-cyan-50 text-cyan-950",
          "border-orange-300 bg-orange-50 text-orange-950",
          "border-lime-300 bg-lime-50 text-lime-950",
          "border-indigo-300 bg-indigo-50 text-indigo-950",
        ];
        return palette[Math.abs(hashString(workoutId)) % palette.length];
      }

      function workoutColorBadgeClasses(workoutId) {
        const palette = [
          "bg-sky-500",
          "bg-emerald-500",
          "bg-amber-500",
          "bg-violet-500",
          "bg-rose-500",
          "bg-cyan-500",
          "bg-orange-500",
          "bg-lime-500",
          "bg-indigo-500",
        ];
        return palette[Math.abs(hashString(workoutId)) % palette.length];
      }

      function exerciseColorClasses(exerciseId) {
        const palette = [
          "border-sky-300 bg-sky-50 text-sky-950",
          "border-emerald-300 bg-emerald-50 text-emerald-950",
          "border-amber-300 bg-amber-50 text-amber-950",

          "border-rose-300 bg-rose-50 text-rose-950",

          "border-orange-300 bg-orange-50 text-orange-950",
          "border-lime-300 bg-lime-50 text-lime-950",
          "border-indigo-300 bg-indigo-50 text-indigo-950",
        ];
        return palette[Math.abs(hashString(exerciseId)) % palette.length];
      }

      function repeatWeeklyWorkoutSchedule(dayAssignments, startDate, lengthDays) {
        const repeated = { ...dayAssignments };
        const firstWeek = Array.from({ length: Math.min(7, lengthDays) }, (_, index) => addDaysToIso(startDate, index));

        for (let dayIndex = 0; dayIndex < lengthDays; dayIndex++) {
          const day = addDaysToIso(startDate, dayIndex);
          const template = firstWeek[dayIndex % firstWeek.length];
          repeated[day] = Array.isArray(dayAssignments?.[template]) ? [...dayAssignments[template]] : [];
        }

        return repeated;
      }

      function syncWorkoutDayAssignments(dayAssignments, startDate, lengthDays, exercises) {
        const next = {};
        const validIds = new Set(exercises.map((exercise) => exercise.workoutItemId || exercise.id));

        for (let index = 0; index < lengthDays; index++) {
          const day = addDaysToIso(startDate, index);
          const assigned = Array.isArray(dayAssignments?.[day]) ? dayAssignments[day] : [];
          next[day] = assigned.filter((assignmentId) => validIds.has(assignmentId));
        }

        return next;
      }

      function normalizeWorkout(workout) {
        const exercises = Array.isArray(workout?.exercises) ? workout.exercises.map(normalizeExercise) : [];
        const date = workout?.date || todayIso();
        const lengthDays = Math.max(1, Number(workout?.lengthDays) || 1);
        let dayAssignments = syncWorkoutDayAssignments(workout?.dayAssignments || {}, date, lengthDays, exercises);

        const hasExistingAssignments = Object.values(dayAssignments).some(
          (dayList) => Array.isArray(dayList) && dayList.length > 0
        );

        if (!hasExistingAssignments && exercises.length > 0) {
          dayAssignments = {
            ...dayAssignments,
            [date]: exercises.map((exercise) => exercise.workoutItemId || exercise.id),
          };
        }

        return {
          ...workout,
          id: workout?.id || uuid(),
          name: workout?.name || "Untitled Workout",
          date,
          lengthDays,
          duration: Number(workout?.duration) || estimateWorkoutDurationFromExercises(exercises),
          exercises,
          notes: workout?.notes || "",
          completed: !!workout?.completed,
          dayAssignments,
        };
      }

      function normalizePitcher(pitcher) {
        return {
          ...pitcher,
          workouts: Array.isArray(pitcher?.workouts) ? pitcher.workouts.map(normalizeWorkout) : [],
        };
      }

      function normalizeProgramData(result) {
        return {
          pitchers: Array.isArray(result?.pitchers) ? result.pitchers.map(normalizePitcher) : [],
          exerciseCategories: Array.isArray(result?.exerciseCategories)
            ? result.exerciseCategories
            : DEFAULT_CATEGORIES,
          exercises: Array.isArray(result?.exercises)
            ? result.exercises.map(normalizeExercise)
            : DEFAULT_EXERCISES,
          lastUpdated: result?.lastUpdated || new Date().toISOString(),
        };
      }

      function AddPitcherModal({ onAdd, onClose, editPitcher = null }) {

            age: 0,
            height: "",

            position: "starter",
            throws: "right",
            mainPitch: "Fastball",
            secondaryPitches: [],
          }

        const pitches = ["Fastball", "Curveball", "Slider", "Changeup", "Cutter", "Sinker", "Splitter"];

        function submit(e) {
          e.preventDefault();
          if (!form.name.trim()) return;

          const pitcher = {
            id: editPitcher?.id || uuid(),
            name: form.name.trim(),
            age: Number(form.age) || 0,
            height: form.height || "",
            weight: Number(form.weight) || 0,
            position: form.position,
            throws: form.throws,
            mainPitch: form.mainPitch,
            secondaryPitches: form.secondaryPitches,
            joinDate: editPitcher?.joinDate || new Date().toISOString().split("T")[0],
            workouts: editPitcher?.workouts || [],
          };

          onAdd(pitcher);
          onClose();
        }

        function toggleSecondaryPitch(pitch) {
          setForm((prev) => ({
            ...prev,
            secondaryPitches: prev.secondaryPitches.includes(pitch)

              })
            ),

              React.createElement("label", { className: "block text-sm font-semibold mb-1" }, "Position"),
              React.createElement(
                "select",
                {
                  className: "form-input",

                  onChange: (e) => setForm((p) => ({ ...p, position: e.target.value })),
                },

              )
            ),

            ),

      function CategoryManager({ categories, exercises, onAddCategory, onUpdateCategory, onDeleteCategory }) {
        const [showForm, setShowForm] = useState(false);
        const [editingCategory, setEditingCategory] = useState(null);
        const [name, setName] = useState("");

        function reset() {
          setShowForm(false);
          setEditingCategory(null);
          setName("");
        }

        function submit(e) {
          e.preventDefault();
          const trimmed = name.trim();
          if (!trimmed) return;

          const duplicate = categories.find(
            (c) => c.name.toLowerCase() === trimmed.toLowerCase() && c.id !== editingCategory?.id
          );
          if (duplicate) {
            alert("A category with that name already exists.");
            return;
          }

          if (editingCategory) {
            onUpdateCategory({ ...editingCategory, name: trimmed });
          } else {
            onAddCategory({ id: uuid(), name: trimmed });
          }
          reset();
        }

        function edit(category) {
          setEditingCategory(category);
          setName(category.name);
          setShowForm(true);
        }

        function remove(categoryId) {
          const isUsed = exercises.some((e) => e.categoryId === categoryId);
          if (isUsed) {
            alert("Cannot delete a category that still has exercises assigned to it.");
            return;
          }
          const category = categories.find((c) => c.id === categoryId);
          if (category) onDeleteCategory(category);
        }

        return React.createElement(
          "div",
          { className: "card mb-6" },
          React.createElement(
            "div",
            { className: "sticky top-20 z-10 flex justify-between items-center gap-3 mb-4 rounded-lg bg-white py-2" },
            React.createElement("h2", { className: "text-2xl font-bold" }, `Exercise Categories (${categories.length})`),

              "+ Add Category"

          ),

            ? React.createElement(ExerciseCategoryModal, {
                editCategory: editingCategory.id ? editingCategory : null,
                categories,
                onClose: () => setEditingCategory(null),
                onSave: (category) => {
                  if (editingCategory.id) onUpdateCategory(category);
                  else onAddCategory(category);
                },
              })
            : null,
          categories.length === 0
            ? React.createElement("p", { className: "text-gray-500 text-center py-6" }, "No categories yet.")
            : React.createElement(
                "div",
                { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3" },
                categories.map((category) => {
                  const count = exercises.filter((e) => e.categoryId === category.id).length;
                  return React.createElement(

                      React.createElement(
                        "button",
                        { className: "text-red-600 hover:text-red-800 font-bold", onClick: () => remove(category.id) },

      function App() {
        const [data, setData] = useState(DEFAULT_DATA);
        const [loading, setLoading] = useState(true);
        const [view, setView] = useState("pitchers");
        const [navOpen, setNavOpen] = useState(false);
        const [selectedPitcher, setSelectedPitcher] = useState(null);
        const [selectedWorkout, setSelectedWorkout] = useState(null);
        const [showPitcherModal, setShowPitcherModal] = useState(false);
        const [editingPitcher, setEditingPitcher] = useState(null);
        const [pendingDelete, setPendingDelete] = useState(null);

        useEffect(() => {
          (async () => {
            const loaded = await loadData();
            setData(loaded);
            setLoading(false);
          })();
        }, []);

        useEffect(() => {
          if (!loading) saveData(data);
        }, [data, loading]);

        function updateData(updater) {
          setData((prev) => ({
            ...updater(prev),
            lastUpdated: new Date().toISOString(),
          }));
        }

        function upsertPitcher(pitcher) {
          updateData((prev) => {
            const exists = prev.pitchers.some((p) => p.id === pitcher.id);
            const nextPitchers = exists
              ? prev.pitchers.map((p) => (p.id === pitcher.id ? pitcher : p))
              : [...prev.pitchers, pitcher];

            return { ...prev, pitchers: nextPitchers };
          });

          setSelectedPitcher((prev) => (prev && prev.id === pitcher.id ? pitcher : prev));
          setEditingPitcher(null);
        }

        function requestDeletePitcher(pitcher) {
          setPendingDelete({
            title: "Delete Pitcher?",
            message: `Are you sure you want to delete pitcher '${pitcher.name}'?`,
            confirmLabel: "Delete Pitcher",
            onConfirm: () => {
              updateData((prev) => ({
                ...prev,
                pitchers: prev.pitchers.filter((p) => p.id !== pitcher.id),
              }));
              if (selectedPitcher?.id === pitcher.id) {
                setSelectedPitcher(null);
                setSelectedWorkout(null);
                setView("pitchers");
              }
            },
          });
        }

        function selectPitcher(pitcher) {
          setSelectedPitcher(pitcher);
          setView("pitcher-detail");
        }

        function openWorkout(workout) {
          setSelectedWorkout(workout);
          setView("workout-builder");
        }

        function createWorkout(workout) {
          if (!selectedPitcher) return;

          let updatedPitcher = null;
          const normalizedWorkout = normalizeWorkout(workout);
          updateData((prev) => {
            const nextPitchers = prev.pitchers.map((pitcher) => {
              if (pitcher.id !== selectedPitcher.id) return pitcher;
              const exists = pitcher.workouts.some((existingWorkout) => existingWorkout.id === normalizedWorkout.id);
              updatedPitcher = {
                ...pitcher,
                workouts: exists
                  ? pitcher.workouts.map((existingWorkout) =>
                      existingWorkout.id === normalizedWorkout.id ? normalizedWorkout : existingWorkout
                    )
                  : [...pitcher.workouts, normalizedWorkout],
              };
              return updatedPitcher;
            });
            return { ...prev, pitchers: nextPitchers };
          });

          if (updatedPitcher) setSelectedPitcher(updatedPitcher);
          setSelectedWorkout(normalizedWorkout);
          setView("pitcher-detail");
        }

        function requestDeleteWorkout(workout) {
          if (!selectedPitcher) return;
          setPendingDelete({
            title: "Remove Workout?",
            message: `Are you sure you want to remove workout '${workout.name}'?`,
            confirmLabel: "Remove Workout",
            onConfirm: () => {
              let updatedPitcher = null;
              updateData((prev) => {
                const nextPitchers = prev.pitchers.map((pitcher) => {
                  if (pitcher.id !== selectedPitcher.id) return pitcher;
                  updatedPitcher = {
                    ...pitcher,
                    workouts: pitcher.workouts.filter((w) => w.id !== workout.id),
                  };
                  return updatedPitcher;
                });
                return { ...prev, pitchers: nextPitchers };
              });
              if (updatedPitcher) setSelectedPitcher(updatedPitcher);
              if (selectedWorkout?.id === workout.id) setSelectedWorkout(null);
            },
          });
        }

        function toggleWorkoutComplete(workoutId) {
          if (!selectedPitcher) return;
          let updatedPitcher = null;
          updateData((prev) => {
            const nextPitchers = prev.pitchers.map((pitcher) => {
              if (pitcher.id !== selectedPitcher.id) return pitcher;
              updatedPitcher = {
                ...pitcher,
                workouts: pitcher.workouts.map((w) =>
                  w.id === workoutId ? { ...w, completed: !w.completed } : w
                ),
              };
              return updatedPitcher;
            });
            return { ...prev, pitchers: nextPitchers };
          });
          if (updatedPitcher) setSelectedPitcher(updatedPitcher);
        }

        function addCategory(category) {
          updateData((prev) => ({
            ...prev,
            exerciseCategories: [...prev.exerciseCategories, category],
          }));
        }

        function updateCategory(category) {
          updateData((prev) => ({
            ...prev,
            exerciseCategories: prev.exerciseCategories.map((c) => (c.id === category.id ? category : c)),
          }));
        }

        function requestDeleteCategory(category) {
          setPendingDelete({
            title: "Delete Exercise Category?",
            message: `Are you sure you want to delete exercise category '${category.name}'?`,
            confirmLabel: "Delete Category",
            onConfirm: () => {
              updateData((prev) => ({
                ...prev,
                exerciseCategories: prev.exerciseCategories.filter((c) => c.id !== category.id),
              }));
            },
          });
        }

        function addExercise(exercise) {
          updateData((prev) => ({
            ...prev,
            exercises: [...prev.exercises, exercise],
          }));
        }

        function updateExercise(exercise) {
          updateData((prev) => ({
            ...prev,
            exercises: prev.exercises.map((e) => (e.id === exercise.id ? exercise : e)),
          }));
        }

        function requestDeleteExercise(exercise) {
          setPendingDelete({
            title: "Delete Exercise?",
            message: `Are you sure you want to delete exercise '${exercise.name}'?`,
            confirmLabel: "Delete Exercise",
            onConfirm: () => {
              updateData((prev) => ({
                ...prev,
                exercises: prev.exercises.filter((e) => e.id !== exercise.id),
              }));
            },
          });
        }

        function closeDeleteModal() {
          setPendingDelete(null);
        }

        function confirmPendingDelete() {
          if (!pendingDelete?.onConfirm) return;
          pendingDelete.onConfirm();
          setPendingDelete(null);
        }

        function exportPitchers() {
          downloadTextFile("pitchers.txt", { pitchers: data.pitchers });
        }

        function exportCategories() {
          downloadTextFile("exercise-categories.txt", { exerciseCategories: data.exerciseCategories });
        }

        function exportExercises() {
          downloadTextFile("exercises.txt", { exercises: data.exercises });
        }

        function exportAll() {
          downloadTextFile("pitching-program-all.txt", data);
        }

        async function importPitchers() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (!parsed || !Array.isArray(parsed.pitchers)) {
                alert("Invalid pitchers file.");
                return;
              }
              if (!confirm("Replace current pitchers with imported pitchers?")) return;
              updateData((prev) => ({
                ...prev,
                pitchers: parsed.pitchers.map(normalizePitcher),
              }));
              setSelectedPitcher(null);
              setSelectedWorkout(null);
              setView("pitchers");
              alert("Pitchers imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import pitchers.");
            }
          });
        }

        async function importCategories() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (!parsed || !Array.isArray(parsed.exerciseCategories)) {
                alert("Invalid exercise categories file.");
                return;
              }

              const normalized = parsed.exerciseCategories
                .map((category) => ({
                  id: category.id || uuid(),
                  name: String(category.name || "").trim(),
                }))
                .filter((c) => c.name);

              if (!confirm("Replace current exercise categories with imported categories?")) return;

              const importedIds = new Set(normalized.map((c) => c.id));
              const invalidExercises = data.exercises.some((exercise) => !importedIds.has(exercise.categoryId));
              if (invalidExercises) {
                alert("Cannot import these categories because some current exercises would reference missing categories. Import categories before exercises, or replace exercises too.");
                return;
              }

              updateData((prev) => ({
                ...prev,
                exerciseCategories: normalized,
              }));

              alert("Exercise categories imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import categories.");
            }
          });
        }

        async function importExercises() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (!parsed || !Array.isArray(parsed.exercises)) {
                alert("Invalid exercises file.");
                return;
              }

              const categoryIds = new Set(data.exerciseCategories.map((c) => c.id));
              const invalid = parsed.exercises.some((exercise) => !categoryIds.has(exercise.categoryId));
              if (invalid) {
                alert("One or more imported exercises reference categories that do not exist in this app. Import categories first.");
                return;
              }

              if (!confirm("Replace current exercises with imported exercises?")) return;

              updateData((prev) => ({
                ...prev,
                exercises: parsed.exercises.map((exercise) => ({
                  videoName: "",
                  videoType: "",
                  videoData: "",
                  ...exercise,
                })),
              }));

              alert("Exercises imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import exercises.");
            }
          });
        }

        async function importAll() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (
                !parsed ||
                !Array.isArray(parsed.pitchers) ||
                !Array.isArray(parsed.exerciseCategories) ||
                !Array.isArray(parsed.exercises)
              ) {
                alert("Invalid full backup file.");
                return;
              }

              const categoryIds = new Set(parsed.exerciseCategories.map((c) => c.id));
              const invalid = parsed.exercises.some((exercise) => !categoryIds.has(exercise.categoryId));
              if (invalid) {
                alert("Backup file is invalid: some exercises reference missing categories.");
                return;
              }

              if (!confirm("Replace ALL current data with the imported backup?")) return;

              setData(normalizeProgramData(parsed));

              setSelectedPitcher(null);
              setSelectedWorkout(null);
              setView("pitchers");
              alert("Full backup imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import backup.");
            }
          });
        }

        const currentPitcher =
          selectedPitcher ? data.pitchers.find((p) => p.id === selectedPitcher.id) || selectedPitcher : null;
        const currentWorkout =
          currentPitcher && selectedWorkout
            ? currentPitcher.workouts.find((workout) => workout.id === selectedWorkout.id) || selectedWorkout
            : null;

        function openView(nextView) {
          setView(nextView);
          setNavOpen(false);
        }

        function renderNavButton(targetView, label) {
          const active = view === targetView;
          return React.createElement(
            "button",
            {
              onClick: () => openView(targetView),
              className: `w-full md:w-auto px-4 py-2 rounded-lg font-semibold text-left md:text-center transition-colors ${
                active ? "bg-baseball-red text-white" : "bg-gray-700 hover:bg-gray-600 text-white"
              }`,
            },
            label
          );
        }

        return React.createElement(
          "div",
          { className: "min-h-screen bg-gradient-to-br from-gray-50 to-gray-100" },
          pendingDelete
            ? React.createElement(DeleteConfirmModal, {
                title: pendingDelete.title,
                message: pendingDelete.message,
                confirmLabel: pendingDelete.confirmLabel,
                onConfirm: confirmPendingDelete,
                onClose: closeDeleteModal,
              })
            : null,
          React.createElement(
            "header",
            { className: "bg-baseball-navy text-white shadow-lg sticky top-0 z-40" },
            React.createElement(
              "div",
              { className: "max-w-6xl mx-auto px-4 py-4" },
              React.createElement(
                "div",
                { className: "flex items-center justify-between gap-4 flex-wrap" },
                React.createElement(
                  "div",
                  { className: "flex items-center gap-3" },
                  React.createElement("div", { className: "text-3xl" }, "⚾"),
                  React.createElement("h1", { className: "text-3xl font-bold" }, "Pitching Program")
                ),
                React.createElement(
                  "button",
                  {
                    type: "button",
                    className: "md:hidden px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 font-semibold",
                    onClick: () => setNavOpen((prev) => !prev),
                    "aria-expanded": navOpen,
                    "aria-label": "Toggle navigation menu",
                  },
                  navOpen ? "Close" : "Menu"
                ),
                React.createElement(
                  "nav",
                  {
                    className: `${navOpen ? "flex" : "hidden"} w-full md:w-auto md:flex flex-col md:flex-row gap-2 flex-wrap`,
                  },
                  renderNavButton("pitchers", "Pitchers"),
                  renderNavButton("exercise-library", "Exercises"),
                  renderNavButton("import-export", "Import / Export")
                )
              )
            )
          ),
          React.createElement(
            "main",
            { className: "max-w-6xl mx-auto px-4 py-8" },
            loading
              ? React.createElement(
                  "div",
                  { className: "card text-center py-12" },
                  React.createElement("p", { className: "text-xl text-gray-600" }, "Loading your program...")
                )
              : React.createElement(
                  "div",
                  { key: `${view}-${currentPitcher?.id || "none"}-${currentWorkout?.id || "none"}`, className: "page-transition" },
                  view === "pitchers" &&
                    React.createElement(
                      "div",
                      null,
                      React.createElement(
                        "div",
                        { className: "flex justify-between items-center mb-6 gap-4 flex-wrap" },
                        React.createElement("h2", { className: "text-2xl font-bold" }, `Your Pitchers (${data.pitchers.length})`),
                        React.createElement(
                          "button",
                          {
                            className: "btn-primary",
                            onClick: () => {
                              setEditingPitcher(null);
                              setShowPitcherModal(true);
                            },
                          },
                          "+ Add Pitcher"
                        )
                      ),
                      showPitcherModal
                        ? React.createElement(AddPitcherModal, {
                            onAdd: upsertPitcher,
                            onClose: () => {
                              setShowPitcherModal(false);
                              setEditingPitcher(null);
                            },
                            editPitcher: editingPitcher,
                          })
                        : null,
                      data.pitchers.length === 0
                        ? React.createElement(
                            "div",
                            { className: "card text-center py-12" },
                            React.createElement(
                              "p",
                              { className: "text-xl text-gray-600 mb-4" },
                              "No pitchers yet. Add your first pitcher to get started!"
                            ),
                            React.createElement(
                              "button",
                              {
                                className: "btn-primary inline-block",
                                onClick: () => {
                                  setEditingPitcher(null);
                                  setShowPitcherModal(true);
                                },
                              },
                              "+ Add Pitcher"
                            )
                          )
                        : React.createElement(
                            "div",
                            { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" },
                            data.pitchers.map((pitcher) =>
                              React.createElement(PitcherCard, {
                                key: pitcher.id,
                                pitcher,
                                onSelect: selectPitcher,
                                onDelete: requestDeletePitcher,
                                onEdit: (p) => {
                                  setEditingPitcher(p);
                                  setShowPitcherModal(true);
                                },
                              })
                            )
                          )
                    ),

                  view === "import-export" &&
                    React.createElement(
                      "div",
                      { className: "space-y-6" },
                      React.createElement(
                        "div",
                        { className: "card" },
                        React.createElement("h2", { className: "text-2xl font-bold mb-2" }, "Import / Export"),
                        React.createElement(
                          "p",
                          { className: "text-sm text-gray-600 mb-6" },
                          "Move data between browsers or devices, or create a full local backup of your pitching program."
                        ),
                        React.createElement(
                          "div",
                          { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
                          React.createElement(
                            "div",
                            { className: "bg-gray-50 rounded-xl border border-gray-200 p-4" },
                            React.createElement("h3", { className: "font-semibold text-lg mb-3" }, "Export"),
                            React.createElement(
                              "div",
                              { className: "flex flex-wrap gap-2" },
                              React.createElement("button", { className: "btn-secondary", onClick: exportPitchers }, "Export Pitchers"),
                              React.createElement("button", { className: "btn-secondary", onClick: exportCategories }, "Export Categories"),
                              React.createElement("button", { className: "btn-secondary", onClick: exportExercises }, "Export Exercises"),
                              React.createElement("button", { className: "btn-primary", onClick: exportAll }, "Export All")
                            )
                          ),
                          React.createElement(
                            "div",
                            { className: "bg-gray-50 rounded-xl border border-gray-200 p-4" },
                            React.createElement("h3", { className: "font-semibold text-lg mb-3" }, "Import"),
                            React.createElement(
                              "div",
                              { className: "flex flex-wrap gap-2" },
                              React.createElement("button", { className: "btn-secondary", onClick: importPitchers }, "Import Pitchers"),
                              React.createElement("button", { className: "btn-secondary", onClick: importCategories }, "Import Categories"),
                              React.createElement("button", { className: "btn-secondary", onClick: importExercises }, "Import Exercises"),
                              React.createElement("button", { className: "btn-primary", onClick: importAll }, "Import All")
                            )
                          )
                        ),
                        React.createElement(
                          "p",
                          { className: "text-sm text-gray-600 mt-6" },
                          "The app still auto-saves in this browser. Use exports to move data to another browser or device."
                        )
                      )
                    ),

                  view === "pitcher-detail" &&
                    currentPitcher &&
                    React.createElement(PitcherDetail, {
                      pitcher: currentPitcher,
                      categories: data.exerciseCategories,
                      onCreateWorkout: () => {
                        setSelectedWorkout(null);
                        setView("workout-builder");
                      },
                      onOpenWorkout: openWorkout,
                      onDeleteWorkout: requestDeleteWorkout,
                      onCompleteWorkout: toggleWorkoutComplete,
                      onBack: () => {
                        setView("pitchers");
                        setSelectedPitcher(null);
                        setSelectedWorkout(null);
                      },
                      onEditPitcher: () => {
                        setEditingPitcher(currentPitcher);
                        setShowPitcherModal(true);
                      },
                    }),

                  view === "workout-builder" &&
                    currentPitcher &&
                    React.createElement(WorkoutBuilder, {
                      pitcher: currentPitcher,
                      exercises: data.exercises,
                      categories: data.exerciseCategories,
                      editWorkout: currentWorkout,
                      onSave: createWorkout,
                      onCancel: () => setView("pitcher-detail"),
                    }),

                  view === "exercise-library" &&
                    React.createElement(
                      "div",
                      { className: "space-y-6" },
                      React.createElement(CategoryManager, {
                        categories: data.exerciseCategories,
                        exercises: data.exercises,
                        onAddCategory: addCategory,
                        onUpdateCategory: updateCategory,
                        onDeleteCategory: requestDeleteCategory,
                      }),
                      React.createElement(ExerciseManager, {
                        exercises: data.exercises,
                        categories: data.exerciseCategories,
                        onAddExercise: addExercise,
                        onUpdateExercise: updateExercise,
                        onDeleteExercise: requestDeleteExercise,
                      })
                    )
                )
          ),
          React.createElement(
            "footer",
            { className: "bg-gray-800 text-gray-300 text-center py-4 mt-12" },
            React.createElement(
              "p",
              null,
              "Pitching Program App • Auto-saves in this browser • Export files to move between devices"
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(React.StrictMode, null, React.createElement(App))
      );
    </script>
  </body>
</html>
