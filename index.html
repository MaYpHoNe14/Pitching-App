      const DB_NAME = "PitchingProgramV2";
      const DB_VERSION = 1;
      const STORE_NAME = "programData";

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
        });
      }

      async function loadData() {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, "readonly");
          const store = tx.objectStore(STORE_NAME);
          const req = store.get("data");

          return new Promise((resolve) => {
            req.onsuccess = () => {
              const result = req.result;
              db.close();
              if (!result) {
                resolve(DEFAULT_DATA);
                return;
              }
              resolve({
                pitchers: Array.isArray(result.pitchers) ? result.pitchers : [],
                exerciseCategories: Array.isArray(result.exerciseCategories)
                  ? result.exerciseCategories
                  : DEFAULT_CATEGORIES,
                exercises: Array.isArray(result.exercises)
                  ? result.exercises.map((exercise) => ({
                      videoName: "",
                      videoType: "",
                      videoData: "",
                      ...exercise,
                    }))
                  : DEFAULT_EXERCISES,
                lastUpdated: result.lastUpdated || new Date().toISOString(),
              });
            };
            req.onerror = () => {
              db.close();
              resolve(DEFAULT_DATA);
            };
          });
        } catch (err) {
          console.error("Failed to load IndexedDB data:", err);
          return DEFAULT_DATA;
        }
      }

      async function saveData(data) {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, "readwrite");
          tx.objectStore(STORE_NAME).put(
            {
              ...data,
              lastUpdated: new Date().toISOString(),
            },
            "data"
          );
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => {
              db.close();
              resolve();
            };
            tx.onerror = () => {
              db.close();
              reject(tx.error);
            };
          });
        } catch (err) {
          console.error("Failed to save IndexedDB data:", err);
        }
      }

      function downloadTextFile(filename, objectData) {
        const text = JSON.stringify(objectData, null, 2);
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      function readJsonFile(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              resolve(parsed);
            } catch (err) {
              reject(new Error("Invalid JSON/TXT file."));
            }
          };
          reader.onerror = () => reject(reader.error);
          reader.readAsText(file);
        });
      }

      function hiddenFileInput(onFile) {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = ".txt,.json,text/plain,application/json";
        input.onchange = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            await onFile(file);
          }
        };
        input.click();
      }

          e.preventDefault();

            id: editPitcher?.id || uuid(),

            height: form.height || "",

            throws: form.throws,

          onAdd(pitcher);
          onClose();
        }

        function toggleSecondaryPitch(pitch) {
          setForm((prev) => ({
            ...prev,
            secondaryPitches: prev.secondaryPitches.includes(pitch)

              ),
              React.createElement("div", null,
                React.createElement("label", { className: "block text-sm font-semibold mb-1" }, "Position"),
                React.createElement(
                  "select",
                  {
                    className: "form-input",
                    value: form.position,
                    onChange: (e) => setForm((p) => ({ ...p, position: e.target.value })),
                  },

      function WorkoutBuilder({ pitcher, exercises, categories, onSave, onCancel }) {
        const [workoutName, setWorkoutName] = useState("");
        const [selectedExercises, setSelectedExercises] = useState([]);
        const [notes, setNotes] = useState("");
        const [draggedExercise, setDraggedExercise] = useState(null);

        const categoryMap = useMemo(() => {
          const map = {};
          categories.forEach((c) => {
            map[c.id] = c.name;
          });
          return map;
        }, [categories]);

        const groupedExercises = useMemo(() => {
          const grouped = {};
          categories.forEach((c) => {
            grouped[c.id] = [];
          });
          exercises.forEach((exercise) => {
            if (!grouped[exercise.categoryId]) grouped[exercise.categoryId] = [];
            grouped[exercise.categoryId].push(exercise);
          });
          return grouped;
        }, [categories, exercises]);

        function addExercise(exercise) {
          setSelectedExercises((prev) => [...prev, { ...exercise, workoutItemId: uuid() }]);
        }

        function removeExercise(index) {
          setSelectedExercises((prev) => prev.filter((_, i) => i !== index));
        }

        function reorderExercise(fromIndex, toIndex) {
          const copy = [...selectedExercises];
          const [moved] = copy.splice(fromIndex, 1);
          copy.splice(toIndex, 0, moved);
          setSelectedExercises(copy);
        }

        function estimateDuration() {
          return (
            selectedExercises.reduce((sum, ex) => {
              const repsNum = parseInt(ex.reps) || 5;
              return sum + repsNum + (Number(ex.rest) || 0);
            }, 0) / 60
          );
        }

        function saveWorkout() {
          if (!workoutName.trim() || selectedExercises.length === 0) {
            alert("Please enter a workout name and add at least one exercise.");
            return;
          }

          const workout = {
            id: uuid(),
            name: workoutName.trim(),
            date: new Date().toISOString().split("T")[0],
            duration: Math.round(estimateDuration()),
            exercises: selectedExercises.map(({ workoutItemId, ...rest }) => rest),
            notes,
            completed: false,
          };

          onSave(workout);
        }

        return React.createElement(
          "div",
          { className: "card max-w-6xl mx-auto" },
          React.createElement("h2", { className: "text-2xl font-bold mb-4" }, "Build Workout for ", pitcher.name),
          React.createElement(
            "div",
            { className: "grid grid-cols-1 md:grid-cols-3 gap-4 mb-4" },
            React.createElement("div", null,
              React.createElement("label", { className: "block text-sm font-semibold mb-2" }, "Workout Name"),
              React.createElement("input", {
                className: "form-input",
                value: workoutName,
                placeholder: "e.g., Arm Day, Recovery Day",
                onChange: (e) => setWorkoutName(e.target.value),
              })
            ),
            React.createElement("div", null,
              React.createElement("label", { className: "block text-sm font-semibold mb-2" }, "Duration (estimated)"),
              React.createElement("div", { className: "bg-gray-100 rounded-lg p-2 text-center font-bold" }, estimateDuration().toFixed(1), " min")
            ),
            React.createElement("div", null,
              React.createElement("label", { className: "block text-sm font-semibold mb-2" }, "Exercises Added"),
              React.createElement("div", { className: "bg-gray-100 rounded-lg p-2 text-center font-bold" }, selectedExercises.length)
            )
          ),
          React.createElement(
            "div",
            { className: "grid grid-cols-1 md:grid-cols-2 gap-4 mb-4" },
            React.createElement(
              "div",
              { className: "border-2 border-dashed border-gray-300 rounded-lg p-4 bg-gray-50" },
              React.createElement("h3", { className: "font-semibold mb-3" }, "Available Exercises"),
              React.createElement(
                "div",
                { className: "space-y-4 max-h-96 overflow-y-auto" },
                categories.map((category) =>
                  React.createElement(
                    "div",
                    { key: category.id },
                    React.createElement(
                      "h4",
                      { className: "font-semibold text-sm mb-2 text-gray-700" },
                      category.name
                    ),
                    (groupedExercises[category.id] || []).length === 0
                      ? React.createElement("p", { className: "text-xs text-gray-400 mb-2" }, "No exercises in this category.")
                      : React.createElement(
                          "div",
                          { className: "space-y-2" },
                          groupedExercises[category.id].map((exercise) =>
                            React.createElement(
                              "div",
                              {
                                key: exercise.id,
                                draggable: true,
                                onDragStart: () => setDraggedExercise(exercise),
                                onDragEnd: () => setDraggedExercise(null),
                                onClick: () => addExercise(exercise),
                                className: "p-2 bg-white rounded border border-gray-200 cursor-move hover:border-red-400 transition-colors",
                              },
                              React.createElement("p", { className: "font-medium text-sm" }, exercise.name),
                              React.createElement(
                                "p",
                                { className: "text-xs text-gray-600" },
                                exercise.sets,
                                " sets × ",
                                exercise.reps,
                                exercise.rest > 0 ? ` • Rest: ${exercise.rest}s` : ""
                              ),
                              exercise.videoData
                                ? React.createElement(
                                    "div",
                                    { className: "mt-2" },
                                    React.createElement(VideoPreview, {
                                      src: exercise.videoData,
                                      maxHeight: "160px",
                                    })
                                  )
                                : null
                            )
                          )
                        )
                  )
                )
              )
            ),
            React.createElement(
              "div",
              { className: "border-2 border-solid border-gray-300 rounded-lg p-4 bg-blue-50 min-h-96" },
              React.createElement("h3", { className: "font-semibold mb-3" }, "Selected Exercises (Drag to reorder)"),
              selectedExercises.length === 0
                ? React.createElement("p", { className: "text-gray-500 text-center py-8" }, "Drag or click exercises to add them")

                    "div",
                    {
                      className: "space-y-2",
                      onDragOver: (e) => e.preventDefault(),
                      onDrop: (e) => e.preventDefault(),
                    },
                    selectedExercises.map((exercise, index) =>
                      React.createElement(

      function CategoryManager({ categories, exercises, onAddCategory, onUpdateCategory, onDeleteCategory }) {
        const [showForm, setShowForm] = useState(false);
        const [editingCategory, setEditingCategory] = useState(null);
        const [name, setName] = useState("");

        function reset() {
          setShowForm(false);
          setEditingCategory(null);
          setName("");
        }

        function submit(e) {
          e.preventDefault();
          const trimmed = name.trim();
          if (!trimmed) return;

          const duplicate = categories.find(
            (c) => c.name.toLowerCase() === trimmed.toLowerCase() && c.id !== editingCategory?.id
          );
          if (duplicate) {
            alert("A category with that name already exists.");
            return;
          }

          if (editingCategory) {
            onUpdateCategory({ ...editingCategory, name: trimmed });
          } else {
            onAddCategory({ id: uuid(), name: trimmed });
          }
          reset();
        }

        function edit(category) {
          setEditingCategory(category);
          setName(category.name);
          setShowForm(true);
        }

        function remove(categoryId) {
          const isUsed = exercises.some((e) => e.categoryId === categoryId);
          if (isUsed) {
            alert("Cannot delete a category that still has exercises assigned to it.");
            return;
          }
          if (confirm("Delete this category?")) {
            onDeleteCategory(categoryId);
          }
        }

        return React.createElement(
          "div",
          { className: "card mb-6" },
          React.createElement(
            "div",
            { className: "flex justify-between items-center mb-4" },
            React.createElement("h2", { className: "text-2xl font-bold" }, `Exercise Categories (${categories.length})`),
            React.createElement(
              "button",
              {
                className: "btn-primary",
                onClick: () => {
                  if (showForm) reset();
                  else setShowForm(true);
                },
              },
              showForm ? "✕ Close" : "+ Add Category"
            )
          ),
          showForm
            ? React.createElement(
                "form",
                { onSubmit: submit, className: "bg-gray-50 rounded-lg p-4 mb-4 border border-gray-300 space-y-3" },
                React.createElement("h3", { className: "font-semibold" }, editingCategory ? "Edit Category" : "Create New Category"),
                React.createElement("input", {
                  className: "form-input",
                  value: name,
                  placeholder: "Category Name",
                  onChange: (e) => setName(e.target.value),
                  required: true,
                }),
                React.createElement(
                  "div",

                    editingCategory ? "Save Category" : "Create Category"

          rest: 60,

          videoData: "",
        });

        useEffect(() => {
          if (!editingExercise && categories.length > 0 && !form.categoryId) {
            setForm((prev) => ({ ...prev, categoryId: categories[0].id }));
          }
        }, [categories]);

        function reset() {
          setShowForm(false);
          setEditingExercise(null);
          setForm({
            categoryId: categories[0]?.id || "",
            name: "",
            description: "",
            sets: 3,
            reps: "10",
            rest: 60,
            videoName: "",
            videoType: "",
            videoData: "",
          });
        }

        function handleVideoFile(file) {
          if (!file) return;

          const maxSizeMB = 100;
          const maxBytes = maxSizeMB * 1024 * 1024;

          if (file.size > maxBytes) {
            alert(`Video is too large. Please choose a file smaller than ${maxSizeMB} MB.`);
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {
            setForm((prev) => ({
              ...prev,
              videoName: file.name || "exercise-video",
              videoType: file.type || "video/mp4",
              videoData: reader.result,
            }));
          };
          reader.onerror = () => {
            alert("Failed to read video file.");
          };
          reader.readAsDataURL(file);
        }

        function submit(e) {
          e.preventDefault();
          if (!form.name.trim()) return;
          if (!form.categoryId) {
            alert("Please choose a category.");
            return;

            id: editingExercise?.id || uuid(),
            categoryId: form.categoryId,
            name: form.name.trim(),
            description: form.description.trim(),
            sets: Number(form.sets) || 1,
            reps: form.reps,
            rest: Number(form.rest) || 0,
            videoName: form.videoName || "",
            videoType: form.videoType || "",
            videoData: form.videoData || "",
          };

          if (editingExercise) onUpdateExercise(payload);
          else onAddExercise(payload);

          reset();
        }

          setEditingExercise(exercise);
          setForm({
            categoryId: exercise.categoryId,

            reps: exercise.reps,
            rest: exercise.rest,
            videoName: exercise.videoName || "",
            videoType: exercise.videoType || "",
            videoData: exercise.videoData || "",

                            : null
                        )
                      )
                    )
              )
            )
          )
        );
      }

      function App() {
        const [data, setData] = useState(DEFAULT_DATA);
        const [loading, setLoading] = useState(true);
        const [view, setView] = useState("pitchers");
        const [selectedPitcher, setSelectedPitcher] = useState(null);
        const [showPitcherModal, setShowPitcherModal] = useState(false);
        const [editingPitcher, setEditingPitcher] = useState(null);

        useEffect(() => {
          (async () => {
            const loaded = await loadData();
            setData(loaded);
            setLoading(false);
          })();
        }, []);

        useEffect(() => {
          if (!loading) saveData(data);
        }, [data, loading]);

        function updateData(updater) {
          setData((prev) => ({
            ...updater(prev),
            lastUpdated: new Date().toISOString(),
          }));
        }

        function upsertPitcher(pitcher) {
          updateData((prev) => {
            const exists = prev.pitchers.some((p) => p.id === pitcher.id);
            const nextPitchers = exists
              ? prev.pitchers.map((p) => (p.id === pitcher.id ? pitcher : p))
              : [...prev.pitchers, pitcher];

            return { ...prev, pitchers: nextPitchers };
          });

          setSelectedPitcher((prev) => (prev && prev.id === pitcher.id ? pitcher : prev));
          setEditingPitcher(null);
        }

        function deletePitcher(id) {
          if (!confirm("Are you sure you want to delete this pitcher?")) return;
          updateData((prev) => ({
            ...prev,
            pitchers: prev.pitchers.filter((p) => p.id !== id),
          }));
          if (selectedPitcher?.id === id) {
            setSelectedPitcher(null);
            setView("pitchers");
          }
        }

        function selectPitcher(pitcher) {
          setSelectedPitcher(pitcher);
          setView("pitcher-detail");
        }

        function createWorkout(workout) {
          if (!selectedPitcher) return;

          let updatedPitcher = null;
          updateData((prev) => {
            const nextPitchers = prev.pitchers.map((pitcher) => {
              if (pitcher.id !== selectedPitcher.id) return pitcher;
              updatedPitcher = { ...pitcher, workouts: [...pitcher.workouts, workout] };
              return updatedPitcher;
            });
            return { ...prev, pitchers: nextPitchers };
          });

          if (updatedPitcher) setSelectedPitcher(updatedPitcher);
          setView("pitcher-detail");
        }

        function deleteWorkout(workoutId) {
          if (!selectedPitcher) return;
          let updatedPitcher = null;
          updateData((prev) => {
            const nextPitchers = prev.pitchers.map((pitcher) => {
              if (pitcher.id !== selectedPitcher.id) return pitcher;
              updatedPitcher = {
                ...pitcher,
                workouts: pitcher.workouts.filter((w) => w.id !== workoutId),
              };
              return updatedPitcher;
            });
            return { ...prev, pitchers: nextPitchers };
          });
          if (updatedPitcher) setSelectedPitcher(updatedPitcher);
        }

        function toggleWorkoutComplete(workoutId) {
          if (!selectedPitcher) return;
          let updatedPitcher = null;
          updateData((prev) => {
            const nextPitchers = prev.pitchers.map((pitcher) => {
              if (pitcher.id !== selectedPitcher.id) return pitcher;
              updatedPitcher = {
                ...pitcher,
                workouts: pitcher.workouts.map((w) =>
                  w.id === workoutId ? { ...w, completed: !w.completed } : w
                ),
              };
              return updatedPitcher;
            });
            return { ...prev, pitchers: nextPitchers };
          });
          if (updatedPitcher) setSelectedPitcher(updatedPitcher);
        }

        function addCategory(category) {
          updateData((prev) => ({
            ...prev,
            exerciseCategories: [...prev.exerciseCategories, category],
          }));
        }

        function updateCategory(category) {
          updateData((prev) => ({
            ...prev,
            exerciseCategories: prev.exerciseCategories.map((c) => (c.id === category.id ? category : c)),
          }));
        }

        function deleteCategory(categoryId) {
          updateData((prev) => ({
            ...prev,
            exerciseCategories: prev.exerciseCategories.filter((c) => c.id !== categoryId),
          }));
        }

        function addExercise(exercise) {
          updateData((prev) => ({
            ...prev,
            exercises: [...prev.exercises, exercise],
          }));
        }

        function updateExercise(exercise) {
          updateData((prev) => ({
            ...prev,
            exercises: prev.exercises.map((e) => (e.id === exercise.id ? exercise : e)),
          }));
        }

        function deleteExercise(exerciseId) {
          updateData((prev) => ({
            ...prev,
            exercises: prev.exercises.filter((e) => e.id !== exerciseId),
          }));
        }

        function exportPitchers() {
          downloadTextFile("pitchers.txt", { pitchers: data.pitchers });
        }

        function exportCategories() {
          downloadTextFile("exercise-categories.txt", { exerciseCategories: data.exerciseCategories });
        }

        function exportExercises() {
          downloadTextFile("exercises.txt", { exercises: data.exercises });
        }

        function exportAll() {
          downloadTextFile("pitching-program-all.txt", data);
        }

        async function importPitchers() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (!parsed || !Array.isArray(parsed.pitchers)) {
                alert("Invalid pitchers file.");
                return;
              }
              if (!confirm("Replace current pitchers with imported pitchers?")) return;
              updateData((prev) => ({
                ...prev,
                pitchers: parsed.pitchers,
              }));
              setSelectedPitcher(null);
              setView("pitchers");
              alert("Pitchers imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import pitchers.");
            }
          });
        }

        async function importCategories() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (!parsed || !Array.isArray(parsed.exerciseCategories)) {
                alert("Invalid exercise categories file.");
                return;
              }

              const normalized = parsed.exerciseCategories
                .map((category) => ({
                  id: category.id || uuid(),
                  name: String(category.name || "").trim(),
                }))
                .filter((c) => c.name);

              if (!confirm("Replace current exercise categories with imported categories?")) return;

              const importedIds = new Set(normalized.map((c) => c.id));
              const invalidExercises = data.exercises.some((exercise) => !importedIds.has(exercise.categoryId));
              if (invalidExercises) {
                alert("Cannot import these categories because some current exercises would reference missing categories. Import categories before exercises, or replace exercises too.");
                return;
              }

              updateData((prev) => ({
                ...prev,
                exerciseCategories: normalized,
              }));

              alert("Exercise categories imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import categories.");
            }
          });
        }

        async function importExercises() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (!parsed || !Array.isArray(parsed.exercises)) {
                alert("Invalid exercises file.");
                return;
              }

              const categoryIds = new Set(data.exerciseCategories.map((c) => c.id));
              const invalid = parsed.exercises.some((exercise) => !categoryIds.has(exercise.categoryId));
              if (invalid) {
                alert("One or more imported exercises reference categories that do not exist in this app. Import categories first.");
                return;
              }

              if (!confirm("Replace current exercises with imported exercises?")) return;

              updateData((prev) => ({
                ...prev,
                exercises: parsed.exercises.map((exercise) => ({
                  videoName: "",
                  videoType: "",
                  videoData: "",
                  ...exercise,
                })),
              }));

              alert("Exercises imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import exercises.");
            }
          });
        }

        async function importAll() {
          hiddenFileInput(async (file) => {
            try {
              const parsed = await readJsonFile(file);
              if (
                !parsed ||
                !Array.isArray(parsed.pitchers) ||
                !Array.isArray(parsed.exerciseCategories) ||
                !Array.isArray(parsed.exercises)
              ) {
                alert("Invalid full backup file.");
                return;
              }

              const categoryIds = new Set(parsed.exerciseCategories.map((c) => c.id));
              const invalid = parsed.exercises.some((exercise) => !categoryIds.has(exercise.categoryId));
              if (invalid) {
                alert("Backup file is invalid: some exercises reference missing categories.");
                return;
              }

              if (!confirm("Replace ALL current data with the imported backup?")) return;

              setData({
                pitchers: parsed.pitchers,
                exerciseCategories: parsed.exerciseCategories,
                exercises: parsed.exercises.map((exercise) => ({
                  videoName: "",
                  videoType: "",
                  videoData: "",
                  ...exercise,
                })),
                lastUpdated: new Date().toISOString(),
              });

              setSelectedPitcher(null);
              setView("pitchers");
              alert("Full backup imported successfully.");
            } catch (err) {
              alert(err.message || "Failed to import backup.");
            }
          });
        }

        const currentPitcher =
          selectedPitcher ? data.pitchers.find((p) => p.id === selectedPitcher.id) || selectedPitcher : null;

        return React.createElement(
          "div",
          { className: "min-h-screen bg-gradient-to-br from-gray-50 to-gray-100" },
          React.createElement(
            "header",
            { className: "bg-baseball-navy text-white shadow-lg sticky top-0 z-40" },
            React.createElement(
              "div",
              { className: "max-w-6xl mx-auto px-4 py-4" },
              React.createElement(
                "div",
                { className: "flex items-center justify-between gap-4 flex-wrap" },
                React.createElement(
                  "div",
                  { className: "flex items-center gap-3" },
                  React.createElement("div", { className: "text-3xl" }, "⚾"),
                  React.createElement("h1", { className: "text-3xl font-bold" }, "Pitching Program")
                ),
                React.createElement(
                  "nav",
                  { className: "flex gap-2 flex-wrap" },
                  React.createElement(
                    "button",
                    {
                      onClick: () => setView("pitchers"),
                      className: `px-4 py-2 rounded-lg font-semibold transition-colors ${
                        view === "pitchers" ? "bg-baseball-red text-white" : "bg-gray-700 hover:bg-gray-600"
                      }`,
                    },
                    "Pitchers"
                  ),
                  React.createElement(
                    "button",
                    {
                      onClick: () => setView("exercise-library"),
                      className: `px-4 py-2 rounded-lg font-semibold transition-colors ${
                        view === "exercise-library" ? "bg-baseball-red text-white" : "bg-gray-700 hover:bg-gray-600"
                      }`,
                    },
                    "Exercises"
                  )
                )
              )
            )
          ),
          React.createElement(
            "main",
            { className: "max-w-6xl mx-auto px-4 py-8" },
            loading
              ? React.createElement(
                  "div",
                  { className: "card text-center py-12" },
                  React.createElement("p", { className: "text-xl text-gray-600" }, "Loading your program...")
                )
              : React.createElement(
                  React.Fragment,
                  null,
                  React.createElement(
                    "div",
                    { className: "card mb-6" },
                    React.createElement("h2", { className: "text-xl font-bold mb-4" }, "Manual Backup / Transfer"),
                    React.createElement(
                      "div",
                      { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                      React.createElement(
                        "div",
                        null,
                        React.createElement("h3", { className: "font-semibold mb-2" }, "Export"),
                        React.createElement(
                          "div",
                          { className: "flex flex-wrap gap-2" },
                          React.createElement("button", { className: "btn-secondary", onClick: exportPitchers }, "Export Pitchers"),
                          React.createElement("button", { className: "btn-secondary", onClick: exportCategories }, "Export Categories"),
                          React.createElement("button", { className: "btn-secondary", onClick: exportExercises }, "Export Exercises"),
                          React.createElement("button", { className: "btn-primary", onClick: exportAll }, "Export All")
                        )
                      ),
                      React.createElement(
                        "div",
                        null,
                        React.createElement("h3", { className: "font-semibold mb-2" }, "Import"),
                        React.createElement(
                          "div",
                          { className: "flex flex-wrap gap-2" },
                          React.createElement("button", { className: "btn-secondary", onClick: importPitchers }, "Import Pitchers"),
                          React.createElement("button", { className: "btn-secondary", onClick: importCategories }, "Import Categories"),
                          React.createElement("button", { className: "btn-secondary", onClick: importExercises }, "Import Exercises"),
                          React.createElement("button", { className: "btn-primary", onClick: importAll }, "Import All")
                        )
                      )
                    ),
                    React.createElement(
                      "p",
                      { className: "text-sm text-gray-600 mt-4" },
                      "The app still auto-saves in this browser. Use exports to move data to another browser or device."
                    )
                  ),

                  view === "pitchers" &&
                    React.createElement(
                      "div",
                      null,
                      React.createElement(
                        "div",
                        { className: "flex justify-between items-center mb-6 gap-4 flex-wrap" },
                        React.createElement("h2", { className: "text-2xl font-bold" }, `Your Pitchers (${data.pitchers.length})`),
                        React.createElement(
                          "button",
                          {
                            className: "btn-primary",
                            onClick: () => {
                              setEditingPitcher(null);
                              setShowPitcherModal(true);
                            },
                          },
                          "+ Add Pitcher"
                        )
                      ),
                      showPitcherModal
                        ? React.createElement(AddPitcherModal, {
                            onAdd: upsertPitcher,
                            onClose: () => {
                              setShowPitcherModal(false);
                              setEditingPitcher(null);
                            },
                            editPitcher: editingPitcher,
                          })
                        : null,
                      data.pitchers.length === 0
                        ? React.createElement(
                            "div",
                            { className: "card text-center py-12" },
                            React.createElement(
                              "p",
                              { className: "text-xl text-gray-600 mb-4" },
                              "No pitchers yet. Add your first pitcher to get started!"
                            ),
                            React.createElement(
                              "button",
                              {
                                className: "btn-primary inline-block",
                                onClick: () => {
                                  setEditingPitcher(null);
                                  setShowPitcherModal(true);
                                },
                              },
                              "+ Add Pitcher"
                            )
                          )
                        : React.createElement(
                            "div",
                            { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" },
                            data.pitchers.map((pitcher) =>
                              React.createElement(PitcherCard, {
                                key: pitcher.id,
                                pitcher,
                                onSelect: selectPitcher,
                                onDelete: deletePitcher,
                                onEdit: (p) => {
                                  setEditingPitcher(p);
                                  setShowPitcherModal(true);
                                },
                              })
                            )
                          )
                    ),

                  view === "pitcher-detail" &&
                    currentPitcher &&
                    React.createElement(PitcherDetail, {
                      pitcher: currentPitcher,
                      categories: data.exerciseCategories,
                      onCreateWorkout: () => setView("workout-builder"),
                      onDeleteWorkout: deleteWorkout,
                      onCompleteWorkout: toggleWorkoutComplete,
                      onBack: () => {
                        setView("pitchers");
                        setSelectedPitcher(null);
                      },
                      onEditPitcher: () => {
                        setEditingPitcher(currentPitcher);
                        setShowPitcherModal(true);
                      },
                    }),

                  view === "workout-builder" &&
                    currentPitcher &&
                    React.createElement(WorkoutBuilder, {
                      pitcher: currentPitcher,
                      exercises: data.exercises,
                      categories: data.exerciseCategories,
                      onSave: createWorkout,
                      onCancel: () => setView("pitcher-detail"),
                    }),

                  view === "exercise-library" &&
                    React.createElement(
                      "div",
                      { className: "space-y-6" },
                      React.createElement(CategoryManager, {
                        categories: data.exerciseCategories,
                        exercises: data.exercises,
                        onAddCategory: addCategory,
                        onUpdateCategory: updateCategory,
                        onDeleteCategory: deleteCategory,
                      }),
                      React.createElement(ExerciseManager, {
                        exercises: data.exercises,
                        categories: data.exerciseCategories,
                        onAddExercise: addExercise,
                        onUpdateExercise: updateExercise,
                        onDeleteExercise: deleteExercise,
                      })
                    )
                )
          ),
          React.createElement(
            "footer",
            { className: "bg-gray-800 text-gray-300 text-center py-4 mt-12" },
            React.createElement(
              "p",
              null,
              "Pitching Program App • Auto-saves in this browser • Export files to move between devices"
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(React.StrictMode, null, React.createElement(App))
      );
    </script>
  </body>
</html>
